name: DomainForge semantic validation

on:
  push:
    branches: [main]
    paths:
      - ".sea/**"
      - ".github/workflows/domainforge-validation.yml"
  pull_request:
    paths:
      - ".sea/**"
      - ".github/workflows/domainforge-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sea:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build DomainForge CLI at the pinned release commit
        run: |
          cargo install --git https://github.com/GodSpeedAI/DomainForge.git --rev 6aef21d59e9793929844a5b0e2c889c523925aea --features cli --locked domainforge-core
          domainforge --version
      - name: Validate reference semantic source
        run: domainforge validate --format human .sea/notes.sea
      - name: Assert compiler emits JSON IR
        run: |
          domainforge parse --format json .sea/notes.sea > /tmp/domainforge-model.json
          python3 -m json.tool /tmp/domainforge-model.json > /dev/null
          echo DOMAINFORGE_IR_OK
