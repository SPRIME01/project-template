name: Optional adapter validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boa:
    name: Boa / Rust execution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/boa
      - name: Verify Rust-native ECMAScript execution
        run: |
          cargo test --manifest-path experiments/boa/Cargo.toml
          cargo run --manifest-path experiments/boa/Cargo.toml

  opentui:
    name: OpenTUI / native renderer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install isolated terminal UI
        working-directory: experiments/opentui
        run: bun install
      - name: Type-check adapter
        working-directory: experiments/opentui
        run: bunx tsc --noEmit -p tsconfig.json
      - name: Spawn native TUI renderer in a real pseudo-terminal
        working-directory: experiments/opentui
        run: |
          set -o pipefail
          export TERM=xterm-256color
          timeout 30s script -qefc "bun src/probe.ts" /dev/null | tee /tmp/opentui-native.log
          grep -q 'OPENTUI_RENDERER_OK' /tmp/opentui-native.log

  tauri-linux:
    name: Tauri 2 / self-contained PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri
      - name: Install Tauri Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xauth xdotool openbox
      - name: Install workspace dependencies
        run: bun install
      - name: Prepare verified offline pg0 binary and app icons
        working-directory: apps/web
        run: |
          bun run desktop:prepare
          bun run desktop:icons
      - name: Compile and test native desktop
        run: |
          cargo check --manifest-path apps/web/src-tauri/Cargo.toml
          cargo test --manifest-path apps/web/src-tauri/Cargo.toml
      - name: Build Linux .deb with PostgreSQL bundled
        working-directory: apps/web
        run: bun run desktop:build -- --bundles deb
      - name: Install the built package and verify resource
        run: |
          DEB="$(find apps/web/src-tauri/target/release/bundle/deb -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          sudo dpkg -i "$DEB"
          PACKAGE="$(dpkg-deb -f "$DEB" Package)"
          dpkg -L "$PACKAGE" | tee /tmp/desktop-package-files.txt
          grep -q '/binaries/pg0$' /tmp/desktop-package-files.txt
          grep -q '/bin/godspeed-project-template$' /tmp/desktop-package-files.txt
      - name: Prove persistent note after database stop and restart
        run: |
          set -euo pipefail
          APP_BIN="$(grep '/bin/godspeed-project-template$' /tmp/desktop-package-files.txt | head -n1)"
          PG0_BIN="$(grep '/binaries/pg0$' /tmp/desktop-package-files.txt | head -n1)"
          mkdir -p "$RUNNER_TEMP/desktop-state"
          "$APP_BIN" --desktop-smoke "$PG0_BIN" "$RUNNER_TEMP/desktop-state" | tee /tmp/desktop-smoke.txt
          grep -q DESKTOP_PERSISTENCE_RESTART_OK /tmp/desktop-smoke.txt
          echo "Passed: no Bun API or manually started PostgreSQL required"

      - name: Launch installed Tauri GUI and confirm automatic PostgreSQL startup and shutdown
        run: |
          set -euo pipefail
          APP_BIN="$(grep '/bin/godspeed-project-template$' /tmp/desktop-package-files.txt | head -n1)"
          PG0_BIN="$(grep '/binaries/pg0$' /tmp/desktop-package-files.txt | head -n1)"
          export HOME="$RUNNER_TEMP/isolated-gui-home"
          export XDG_DATA_HOME="$HOME/.local/share"
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          mkdir -p "$HOME" "$XDG_DATA_HOME"
          xvfb-run -a bash -s "$APP_BIN" "$PG0_BIN" <<'GUI_TEST'
          set -euo pipefail
          APP_BIN="$1"
          PG0_BIN="$2"
          # Xvfb has no window manager; run Openbox so Alt+F4 follows a real
          # WM_DELETE_WINDOW path instead of destroying a GTK drawable directly.
          openbox >/tmp/openbox.log 2>&1 &
          wm=$!
          trap 'kill "$wm" 2>/dev/null || true' EXIT
          sleep 1
          "$APP_BIN" >/tmp/tauri-window.log 2>&1 &
          child=$!
          trap 'kill "$child" 2>/dev/null || true' EXIT
          found=0
          for attempt in $(seq 1 30); do
            if xdotool search --name "GodSpeed Project Template" >/dev/null 2>&1; then found=1; break; fi
            if ! kill -0 "$child" 2>/dev/null; then cat /tmp/tauri-window.log; exit 1; fi
            sleep 1
          done
          test "$found" -eq 1 || { cat /tmp/tauri-window.log; exit 1; }
          ready=0
          for attempt in $(seq 1 30); do
            info="$("$PG0_BIN" info --name godspeed-project-template-desktop -o json 2>/dev/null || true)"
            if printf '%s' "$info" | python3 -c 'import json,sys; sys.exit(not json.load(sys.stdin).get("running",False))' 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1 || { cat /tmp/tauri-window.log; exit 1; }
          echo TAURI_GUI_NATIVE_IPC_DATABASE_BOOT_OK
          window_id="$(xdotool search --name 'GodSpeed Project Template' 2>/dev/null | head -n1 || true)"
          if [ -n "$window_id" ]; then
            xdotool windowactivate --sync "$window_id"
            xdotool key --clearmodifiers Alt+F4
          else
            echo "Window vanished before close; investigating process state"
          fi
          for attempt in $(seq 1 20); do
            if ! kill -0 "$child" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$child" 2>/dev/null; then echo "GUI did not exit"; exit 1; fi
          wait "$child" || true
          info="$("$PG0_BIN" info --name godspeed-project-template-desktop -o json)"
          echo "GUI database status following window close:"
          printf '%s\n' "$info" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("running=", d.get("running"), "pid=", d.get("pid"), "port=", d.get("port"))'
          echo "Last native application messages:"
          tail -n 100 /tmp/tauri-window.log || true
          printf '%s' "$info" | python3 -c 'import json,sys; sys.exit(json.load(sys.stdin).get("running",False))'
          echo TAURI_GUI_GRACEFUL_SHUTDOWN_OK
          GUI_TEST
