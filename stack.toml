[stack]
name = "godspeed-project-template"
version = "0.2.0"
primary_language = "typescript"
native_language = "rust"
application_runtime = "bun"
minimum_bun = "1.4.0"
desktop_shell = "tauri2"

[relational]
query_builder = "kysely"
dialect = "kysely-postgres-js"
client = "postgres"
database = "postgresql"
local_distribution = "pg0"
default_javascript_client = "postgres.js"
desktop_native_client = "sqlx"
bun_sql_is_default = false

[contracts]
validator = "valibot"
interop = "standard-schema-v1"
source_of_domain_meaning = "domainforge-sea"
projection_generation_status = "unverified"

[applications]
api = "apps/api"
web = "apps/web"
desktop = "apps/web/src-tauri"
cli = "apps/cli"

[desktop]
pg0_release = "v0.15.2"
bundling = "sha256-verified-platform-binary"
runtime_database = "postgresql"
backend = "rust-sqlx-narrow-tauri-ipc"
bun_sidecar_required = false
standalone_smoke = "optional-validation-tauri-linux-job"

[experimental]
ruvector_pg0 = "native-extension-pg18-abi-validation-pending"
servo = "research-only"
boa = "experiments/boa"
opentui = "experiments/opentui"

[verification]
basic_command = "bun run check"
database_command = "bun run db:smoke"
ruvector_probe = "bun run db:ruvector"
lockfile_committed = false
github_ci_confirmed = false
desktop_release_confirmed = false
